<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵感卡片墙 · 秋风落叶</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body data-atmosphere="dusk">

  <!-- 背景层：秋日天空 + 远景线条画 -->
  <div class="bg-layer sky"></div>
  <svg class="bg-layer scenery" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <!-- 远山 -->
    <path class="scenery-line" d="M0,720 Q200,640 380,690 Q540,730 720,680 Q900,640 1080,700 Q1260,750 1420,690 Q1500,665 1600,685 L1600,900 L0,900 Z" />
    <!-- 近山 -->
    <path class="scenery-line soft" d="M0,790 Q260,740 520,780 Q780,820 1040,775 Q1300,740 1600,790 L1600,900 L0,900 Z" />
    <!-- 远树（左） -->
    <g class="scenery-line soft" transform="translate(120,720)">
      <line x1="0" y1="0" x2="0" y2="60" />
      <circle cx="0" cy="-8" r="22" />
      <circle cx="-14" cy="2" r="16" />
      <circle cx="14" cy="2" r="16" />
    </g>
    <g class="scenery-line soft" transform="translate(180,740)">
      <line x1="0" y1="0" x2="0" y2="42" />
      <circle cx="0" cy="-6" r="15" />
    </g>
    <!-- 远树（右） -->
    <g class="scenery-line soft" transform="translate(1380,710)">
      <line x1="0" y1="0" x2="0" y2="68" />
      <circle cx="0" cy="-10" r="24" />
      <circle cx="-16" cy="4" r="17" />
      <circle cx="16" cy="4" r="17" />
    </g>
    <!-- 云 -->
    <g class="scenery-line cloud" transform="translate(300,180)">
      <path d="M0,0 q-18,-20 6,-28 q8,-22 32,-12 q18,-18 38,4 q22,-6 26,16 q16,12 -2,20 Z" />
    </g>
    <g class="scenery-line cloud" transform="translate(1080,140)">
      <path d="M0,0 q-22,-18 2,-26 q10,-24 34,-12 q22,-14 40,8 q22,-2 22,18 q14,16 -6,18 Z" />
    </g>
    <!-- 芦苇 -->
    <g class="scenery-line reed" transform="translate(820,820)">
      <line x1="0" y1="0" x2="-6" y2="-70" />
      <ellipse cx="-7" cy="-72" rx="2.5" ry="7" />
      <line x1="6" y1="0" x2="14" y2="-78" />
      <ellipse cx="15" cy="-80" rx="2.5" ry="7" />
      <line x1="14" y1="0" x2="20" y2="-60" />
      <ellipse cx="21" cy="-62" rx="2.5" ry="7" />
    </g>
    <g class="scenery-line reed" transform="translate(1180,830)">
      <line x1="0" y1="0" x2="-5" y2="-64" />
      <ellipse cx="-6" cy="-66" rx="2.5" ry="7" />
      <line x1="8" y1="0" x2="16" y2="-72" />
      <ellipse cx="17" cy="-74" rx="2.5" ry="7" />
    </g>
    <!-- 地平线 -->
    <line class="scenery-line soft" x1="0" y1="820" x2="1600" y2="820" />
  </svg>

  <!-- 落叶舞台 -->
  <main class="stage" id="stage">
    <div class="leaves" id="leaves"></div>
    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-leaf">🍂</div>
      <p>这片林子还空着</p>
      <span>点底部的「+ 新建」让第一片叶子飘进来</span>
    </div>
  </main>

  <!-- 顶部小徽标（卡片数） -->
  <div class="top-badge" id="topBadge">
    <span class="leaf-dot">🍂</span>
    <span id="cardCount">0 片</span>
  </div>

  <!-- 底部 Dock 胶囊菜单 -->
  <div class="dock-outer" id="dockOuter">
    <div class="dock-panel" id="dockPanel" role="toolbar" aria-label="灵感卡片墙菜单">
      <!-- 搜索条（默认隐藏，点搜索后展开） -->
      <div class="dock-search" id="dockSearch" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/>
        </svg>
        <input type="search" id="searchInput" placeholder="搜索标题、正文、来源、标签…" autocomplete="off" />
      </div>

      <button type="button" class="dock-item" data-act="search" aria-label="搜索" tabindex="0">
        <span class="dock-icon">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        </span>
        <span class="dock-label">搜索</span>
      </button>

      <button type="button" class="dock-item" data-act="sort" aria-label="排序分组" tabindex="0">
        <span class="dock-icon">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 4h2v12l3-3 1.4 1.4L8 20.8 2.6 14.4 4 13l3 3V4zm10 16h-2V8l-3 3-1.4-1.4L16 3.2l5.4 5.4L20 10l-3-3v13z"/></svg>
        </span>
        <span class="dock-label">排序</span>
      </button>

      <button type="button" class="dock-item" data-act="atmosphere" aria-label="氛围" tabindex="0">
        <span class="dock-icon">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </span>
        <span class="dock-label">氛围</span>
      </button>

      <button type="button" class="dock-item" data-act="manage" aria-label="管理面板" tabindex="0">
        <span class="dock-icon">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
        </span>
        <span class="dock-label">管理</span>
      </button>

      <button type="button" class="dock-item dock-item-primary" data-act="new" aria-label="新建卡片" tabindex="0">
        <span class="dock-icon">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z"/></svg>
        </span>
        <span class="dock-label">新建</span>
      </button>
    </div>

    <!-- 排序气泡 -->
    <div class="dock-pop" id="sortPop" hidden>
      <button type="button" data-sort="latest" class="active">最新在前</button>
      <button type="button" data-sort="random">随机秋风</button>
      <button type="button" data-sort="source">按来源分组</button>
    </div>

    <!-- 氛围气泡 -->
    <div class="dock-pop" id="atmospherePop" hidden>
      <button type="button" data-atmosphere="dusk" class="active"><span class="sw sw-dusk"></span>黄昏暖金</button>
      <button type="button" data-atmosphere="mist"><span class="sw sw-mist"></span>清晨薄雾</button>
      <button type="button" data-atmosphere="rain"><span class="sw sw-rain"></span>雨后冷黄</button>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="overlay" id="detailOverlay" hidden>
    <div class="modal detail-modal" id="detailModal">
      <div class="detail-leaf-corner" id="detailLeafCorner"></div>
      <button class="close-btn" data-close-detail aria-label="关闭">×</button>
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-meta">
        <div class="detail-tags" id="detailTags"></div>
        <div class="detail-info">
          <span class="detail-source" id="detailSource"></span>
          <span class="detail-time" id="detailTime"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="detailEditBtn">编辑</button>
        <button type="button" class="danger-btn" id="detailDeleteBtn">删除</button>
      </div>
    </div>
  </div>

  <!-- 新建/编辑弹窗 -->
  <div class="overlay" id="editOverlay" hidden>
    <div class="modal edit-modal" id="editModal">
      <button class="close-btn" data-close-edit aria-label="关闭">×</button>
      <h2 class="modal-heading" id="editHeading">新建一片叶</h2>
      <form id="cardForm" class="card-form">
        <label class="field">
          <span class="field-label">标题 <em>*</em></span>
          <input type="text" name="title" maxlength="60" placeholder="给灵感起个名字" required />
        </label>

        <label class="field">
          <span class="field-label">正文 <em>*</em></span>
          <textarea name="body" rows="5" placeholder="写下你的灵感、句子或语录…" required></textarea>
        </label>

        <label class="field">
          <span class="field-label">来源</span>
          <input type="text" name="source" maxlength="80" placeholder="书名 / 作者 / 网址（选填）" />
        </label>

        <div class="field">
          <span class="field-label">标签</span>
          <div class="tags-box" id="tagsBox"></div>
          <input type="text" id="tagInput" placeholder="输入后回车添加" />
        </div>

        <div class="field">
          <span class="field-label">叶片外观</span>
          <div class="leaf-config">
            <div class="leaf-type-row" id="leafTypeRow"></div>

            <div class="leaf-color-row">
              <div class="preset-colors" id="presetColors"></div>
              <label class="custom-color">
                <span>自定义</span>
                <input type="color" name="color" value="#d94e2f" />
              </label>
            </div>

            <label class="auto-leaf">
              <input type="checkbox" id="autoLeaf" checked />
              <span>按标签自动选叶型与颜色</span>
            </label>
          </div>
        </div>

        <div class="field">
          <span class="field-label">预览</span>
          <div class="preview-leaf" id="previewLeaf">
            <div class="pl-content">
              <h3 class="pl-title">标题预览</h3>
              <p class="pl-body">正文预览内容…</p>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="ghost-btn" data-close-edit>取消</button>
          <button type="submit" class="primary-btn">让这片叶飘起</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="overlay" id="confirmOverlay" hidden>
    <div class="modal confirm-modal">
      <div class="confirm-leaf">🍂</div>
      <p class="confirm-text">确认让这片叶子飘走？</p>
      <span class="confirm-sub">此操作不可撤销</span>
      <div class="form-actions">
        <button type="button" class="ghost-btn" id="confirmNo">留下它</button>
        <button type="button" class="danger-btn" id="confirmYes">让它飘走</button>
      </div>
    </div>
  </div>

  <!-- 管理面板 -->
  <aside class="manage-panel" id="managePanel" hidden>
    <div class="manage-head">
      <h2>落叶归档</h2>
      <input type="search" id="manageSearch" placeholder="搜索…" autocomplete="off" />
      <button type="button" class="close-btn" data-close-manage aria-label="关闭">×</button>
    </div>
    <div class="manage-grid" id="manageGrid"></div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="app.js?v=15"></script>
</body>
</html>
